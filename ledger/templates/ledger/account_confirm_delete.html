{% extends "ledger/base.html" %}
{% block title %}Delete account — Cash{% endblock %}
{% block content %}
<h1 class="mb-4">Delete account</h1>
<p>Are you sure you want to delete <strong>{{ object.name }}</strong>? If it has any transaction history, deletion will be blocked — deactivate it instead.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'ledger:account_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
